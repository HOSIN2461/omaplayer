name: CI

# Windows-port branch while the port lands; widened to main afterwards.
on:
  push:
    branches: [windows-port]
  pull_request:
    branches: [windows-port]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu, Qt ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        qt: ["6.8.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libmpv-dev libsodium-dev libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build -j"$(nproc)"

  windows:
    name: Windows (MSVC, Qt ${{ matrix.qt }})
    runs-on: windows-latest
    strategy:
      matrix:
        qt: ["6.8.2"]
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (dumpbin/lib on PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: win64_msvc2022_64
          cache: true

      - name: vcpkg deps (OpenSSL, libsodium)
        shell: pwsh
        run: |
          vcpkg install openssl libsodium --triplet x64-windows

      - name: libmpv (headers + import lib)
        shell: pwsh
        env:
          MPV_ROOT: ${{ github.workspace }}/mpv-pkg/root
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force mpv-pkg | Out-Null
          # -dev package: headers + libmpv-2.dll (the .dll.a inside is MinGW
          # format, unusable by MSVC — the import lib is rebuilt below).
          # x86_64 WITHOUT -v3 (runs on every 64-bit PC).
          $rel = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $dev = $rel.assets | Where-Object { $_.name -match "^mpv-dev-x86_64-[0-9].*\.7z$" } | Select-Object -First 1
          if (-not $dev) { throw "no mpv-dev x86_64 asset in latest shinchiro release" }
          Invoke-WebRequest $dev.browser_download_url -OutFile mpv-pkg/mpv-dev.7z
          7z x mpv-pkg/mpv-dev.7z -ompv-pkg/dev | Out-Null
          $hdr = Get-ChildItem -Recurse mpv-pkg/dev -Filter client.h | Select-Object -First 1
          if (-not $hdr) { throw "mpv headers not found in dev package" }
          $mpvDll = Get-ChildItem -Recurse mpv-pkg/dev -Filter mpv-?.dll | Select-Object -First 1
          if (-not $mpvDll) { throw "no mpv-?.dll in dev package" }
          # MSVC import lib, always (re)built from the DLL exports.
          dumpbin /exports $mpvDll.FullName | Out-File mpv-pkg/exports.txt
          $names = Select-String "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" mpv-pkg/exports.txt |
            ForEach-Object { $_.Matches.Groups[1].Value } |
            Where-Object { $_ -notmatch "=" }
          if (-not $names) { throw "no exports found in $($mpvDll.Name)" }
          $dllBase = [System.IO.Path]::GetFileNameWithoutExtension($mpvDll.Name)
          "LIBRARY $dllBase`nEXPORTS" | Out-File mpv-pkg/mpv.def -Encoding ascii
          $names | Out-File mpv-pkg/mpv.def -Append -Encoding ascii
          lib /def:mpv-pkg/mpv.def /machine:x64 /out:mpv-pkg/mpv.lib | Out-Null
          New-Item -ItemType Directory -Force $env:MPV_ROOT/include/mpv, $env:MPV_ROOT/lib, $env:MPV_ROOT/bin | Out-Null
          Copy-Item (Join-Path $hdr.Directory "client.h") $env:MPV_ROOT/include/mpv/
          Copy-Item (Join-Path $hdr.Directory "render*.h") $env:MPV_ROOT/include/mpv/
          Copy-Item (Join-Path $hdr.Directory "stream_cb.h") $env:MPV_ROOT/include/mpv/
          Copy-Item mpv-pkg/mpv.lib (Join-Path $env:MPV_ROOT "lib/mpv.lib")
          Copy-Item $mpvDll.FullName (Join-Path $env:MPV_ROOT ("bin/" + $mpvDll.Name))
          # Verify every expected output exists.
          foreach ($f in @("include/mpv/client.h", "include/mpv/render_gl.h", "lib/mpv.lib", "bin/" + $mpvDll.Name)) {
            if (-not (Test-Path (Join-Path $env:MPV_ROOT $f))) { throw "missing output: $f" }
          }
          Get-ChildItem $env:MPV_ROOT -Recurse | Select-Object FullName

      - name: ffmpeg + ffprobe
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          7z x ffmpeg.zip -offmpeg-pkg | Out-Null
          Get-ChildItem -Recurse ffmpeg-pkg -Filter ffmpeg.exe | Select-Object -First 1 |
            Copy-Item -Destination ffmpeg.exe
          Get-ChildItem -Recurse ffmpeg-pkg -Filter ffprobe.exe | Select-Object -First 1 |
            Copy-Item -Destination ffprobe.exe

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DMPV_ROOT="$env:MPV_ROOT"
        env:
          MPV_ROOT: ${{ github.workspace }}/mpv-pkg/root

      - name: Build
        run: cmake --build build --config Release -j

      - name: Deploy (windeployqt + bundle)
        shell: pwsh
        env:
          MPV_ROOT: ${{ github.workspace }}/mpv-pkg/root
        run: |
          $ErrorActionPreference = "Stop"
          $qtbin = Join-Path $env:QT_ROOT_DIR "bin"
          & "$qtbin/windeployqt.exe" --release --compiler-runtime --qmldir qml build/Release/omaplayer.exe
          New-Item -ItemType Directory -Force dist/omaplayer-win64 | Out-Null
          Copy-Item build/Release/omaplayer.exe dist/omaplayer-win64/
          Get-ChildItem build/Release -Filter *.dll | Copy-Item -Destination dist/omaplayer-win64/
          Get-ChildItem build/Release -Directory | Copy-Item -Destination dist/omaplayer-win64/ -Recurse -Force
          Copy-Item $env:MPV_ROOT/bin/mpv-*.dll dist/omaplayer-win64/
          Copy-Item ffmpeg.exe, ffprobe.exe dist/omaplayer-win64/
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          Copy-Item $vcpkgBin/libssl-*.dll, $vcpkgBin/libcrypto-*.dll, $vcpkgBin/libsodium.dll dist/omaplayer-win64/ -ErrorAction SilentlyContinue
          Get-ChildItem dist/omaplayer-win64 | Select-Object Name

      - name: Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/omaplayer-win64 -DestinationPath omaplayer-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: omaplayer-win64
          path: omaplayer-win64.zip

  macos:
    name: macOS (Clang, Qt ${{ matrix.qt }})
    runs-on: macos-14
    strategy:
      matrix:
        qt: ["6.8.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: brew deps (mpv, libsodium, openssl, ffmpeg, ninja, dylibbundler)
        run: |
          brew install mpv libsodium openssl@3 ffmpeg ninja pkg-config dylibbundler

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          -DPKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libsodium)/lib/pkgconfig"

      - name: Build
        run: cmake --build build -j

      - name: Bundle (macdeployqt + dylibs + ffmpeg + ad-hoc sign)
        run: |
          set -e
          "$QT_ROOT_DIR/bin/macdeployqt" build/omaplayer.app -qmldir=qml
          dylibbundler -od -b \
            -x build/omaplayer.app/Contents/MacOS/omaplayer \
            -d build/omaplayer.app/Contents/libs/
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" build/omaplayer.app/Contents/MacOS/
          cp "$(brew --prefix ffmpeg)/bin/ffprobe" build/omaplayer.app/Contents/MacOS/
          codesign --force --deep -s - build/omaplayer.app
          ditto -c -k --keepParent build/omaplayer.app omaplayer-macos.zip
          ls -la omaplayer-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: omaplayer-macos
          path: omaplayer-macos.zip
